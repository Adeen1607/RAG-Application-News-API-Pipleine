name: News metadata quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight validator test dependencies
        run: python -m pip install "pandas>=2.0,<3.0" "pytest>=8.0,<9.0"
      - name: Compile validator
        run: python -m compileall -q src
      - name: Test news metadata validation
        run: python -m pytest -q tests
